# Comprobaciones automáticas en cada push y pull request:
# tests, compilación, tests de las reglas de Firestore (con el emulador) y
# pruebas de extremo a extremo en un navegador contra los emuladores.
# Si algo falla, GitHub marca el commit en rojo y avisa por email.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Tests de reglas de Firestore (emulador)
        run: npm run test:rules

      # La app compilada contra los emuladores de Firebase (usuarios y base de
      # datos de prueba, nunca producción) y probada en un navegador de verdad:
      # entrar, recorrer los módulos, marcar paradas, stock, líneas…
      - name: Navegador para las pruebas
        run: npx playwright install --with-deps chromium

      - name: Pruebas de extremo a extremo (emuladores)
        run: npm run e2e

      - name: Guardar el rastro si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rastro
          path: test-results/
          retention-days: 7
